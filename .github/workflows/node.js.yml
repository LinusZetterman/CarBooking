# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['main', 'feature/actions-deployment-pipeline']
  pull_request:
    branches: ['main', 'feature/actions-deployment-pipeline']
  workflow_dispatch: # <--- Enables action to be run with button

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.23.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
      # - run: npm test

      - name: Assemble release
        run: |
          mkdir release
          cp -r build package.json package-lock.json release/
          cp -r deploy release/deploy

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_PATH: /var/www/car-booking-app
      REMOTE: ${{secrets.DEPLOY_USER}}@${{secrets.DEPLOY_HOST}}
      RELEASE: $(date +%Y%m%d-%H%M%S)-${{github.sha::7}}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Configure ssh
        run: |
          install -m 755 -d ~/.ssh
          echo "${{secrets.DEPLOY_SSH_KEY}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo | ssh-keyscan -H ${{secrets.DEPLOY_HOST}} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          ssh $REMOTE "mkdir -p $APP_PATH/releases/$RELEASE"
          rsync -az --delete release/ $APP_PATH/releases/$RELEASE/
